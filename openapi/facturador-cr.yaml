  /company/{companyId}/logs:
    post:
      tags: [Logs]
      summary: Registrar mensaje en bitácora
      description: Inserta un registro en `{idMasterUser}_master_logs` a través de `insertToLogTable`.
      security:
        - CompanySessionAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: object
                  description: Objeto arbitrario serializado a JSON antes de almacenarse.
      responses:
        '202':
          description: Log encolado
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    CompanySessionAuth:
      type: apiKey
      in: header
      name: X-Company-Session
  parameters:
    CompanyIdParam:
      name: companyId
      in: path
      required: true
      schema:
        type: integer
      description: Identificador del `idMasterUser`.
    BranchIdParam:
      name: branchId
      in: path
      required: true
      schema:
        type: integer
    ReceiverIdParam:
      name: receiverId
      in: path
      required: true
      schema:
        type: integer
    ProvinceIdParam:
      name: provinceId
      in: path
      required: true
      schema:
        type: string
    CantonIdParam:
      name: cantonId
      in: path
      required: true
      schema:
        type: string
    DistrictIdParam:
      name: districtId
      in: path
      required: true
      schema:
        type: string
    DocumentTypeParam:
      name: documentType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DocumentTypeEnum'
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
    AdminLoginRequest:
      type: object
      required: [userName, password]
      properties:
        userName:
          type: string
          format: email
        password:
          type: string
          format: password
    AdminSession:
      type: object
      properties:
        token:
          type: string
          description: Token de sesión (`sessionKey`).
        user:
          $ref: '#/components/schemas/AdminUser'
    AdminUserCreateRequest:
      type: object
      required: [fullName, userName, email, password]
      properties:
        fullName:
          type: string
        userName:
          type: string
          description: Usuario único para iniciar sesión.
        email:
          type: string
          format: email
        about:
          type: string
          description: Información adicional.
        country:
          type: string
          example: crc
        password:
          type: string
          format: password
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        userName:
          type: string
        email:
          type: string
        fullName:
          type: string
    CompanyLoginRequest:
      type: object
      required: [companyId, userName, password]
      properties:
        companyId:
          type: integer
        userName:
          type: string
        password:
          type: string
          format: password
    CompanySession:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Valor `sessionKey` devuelto por `companny_users_generateSessionKey`.
        user:
          $ref: '#/components/schemas/CompanyUser'
    CompanyUserCreateRequest:
      type: object
      required: [companyId, fullName, userName, email, password]
      properties:
        companyId:
          type: integer
        fullName:
          type: string
        userName:
          type: string
        email:
          type: string
          format: email
        about:
          type: string
        country:
          type: string
        password:
          type: string
          format: password
        terminalId:
          type: integer
          description: Id del terminal que se asignará en el campo `settings`.
    CompanyUser:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        userName:
          type: string
        email:
          type: string
        terminal:
          type: string
        branch:
          type: string
    CompanyProfile:
      type: object
      properties:
        name:
          type: string
        commercialName:
          type: string
        identificationType:
          type: string
        identificationNumber:
          type: string
        email:
          type: string
        phone:
          type: string
        fax:
          type: string
        countryCode:
          type: string
        environment:
          $ref: '#/components/schemas/EnvironmentEnum'
        exchangeRate:
          type: number
          format: float
        address:
          $ref: '#/components/schemas/Address'
    CompanyProfileUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/CompanyProfile'
    CompanyLocationUpdate:
      type: object
      required: [province, canton, district, neighborhood, otherDirections]
      properties:
        province:
          type: string
        canton:
          type: string
        district:
          type: string
        neighborhood:
          type: string
        otherDirections:
          type: string
    ExchangeRateUpdate:
      type: object
      required: [exchangeRate]
      properties:
        exchangeRate:
          type: number
          format: float
    EnvironmentEnum:
      type: string
      enum: [api-stag, api-prod]
    EnvironmentStatus:
      type: object
      properties:
        environment:
          $ref: '#/components/schemas/EnvironmentEnum'
    EnvironmentUpdate:
      type: object
      required: [environment]
      properties:
        environment:
          $ref: '#/components/schemas/EnvironmentEnum'
    HaciendaCredentials:
      type: object
      properties:
        userName:
          type: string
        password:
          type: string
        certificateCode:
          type: string
        pin:
          type: string
    HaciendaCredentialsUpdate:
      type: object
      required: [userName, password, certificateCode, pin]
      properties:
        userName:
          type: string
        password:
          type: string
        certificateCode:
          type: string
        pin:
          type: string
    Branch:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
    BranchCreateRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    Terminal:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        branch:
          type: string
    TerminalCreateRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    Receiver:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        identificationType:
          type: string
        identificationNumber:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          $ref: '#/components/schemas/Address'
    ReceiverCreateRequest:
      type: object
      required:
        - name
        - identificationType
        - identificationNumber
        - province
        - canton
        - district
        - neighborhood
        - otherDirections
      properties:
        name:
          type: string
        commercialName:
          type: string
        identificationType:
          type: string
        identificationNumber:
          type: string
        phone:
          type: string
        email:
          type: string
        copyEmails:
          type: string
        fax:
          type: string
        province:
          type: string
        canton:
          type: string
        district:
          type: string
        neighborhood:
          type: string
        otherDirections:
          type: string
    InventoryItem:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        unit:
          type: string
        salePrice:
          type: number
        available:
          type: integer
    InventoryItemCreateRequest:
      type: object
      required:
        - name
        - description
        - unit
        - salePrice
        - taxId
        - taxRate
        - branchId
      properties:
        name:
          type: string
        description:
          type: string
        unit:
          type: string
        salePrice:
          type: number
        taxId:
          type: integer
        taxRate:
          type: number
        barcode:
          type: string
        available:
          type: integer
        branchId:
          type: integer
    ProductLookupResponse:
      type: object
      properties:
        productId:
          type: integer
        description:
          type: string
        unit:
          type: string
        salePrice:
          type: number
        taxCode:
          type: string
        taxRate:
          type: number
    VoucherSummary:
      type: object
      properties:
        id:
          type: integer
        consecutive:
          type: string
        clave:
          type: string
        documentType:
          $ref: '#/components/schemas/DocumentTypeEnum'
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    VoucherCreateRequest:
      type: object
      required:
        - env
        - clave
        - consecutivo
        - documentType
        - status
        - xmlBase64
        - invoice
      properties:
        env:
          $ref: '#/components/schemas/EnvironmentEnum'
        clave:
          type: string
        consecutivo:
          type: string
        documentType:
          $ref: '#/components/schemas/DocumentTypeEnum'
        receiverId:
          type: integer
        status:
          type: string
        xmlBase64:
          type: string
          description: XML firmado codificado en Base64.
        mhResponseBase64:
          type: string
          nullable: true
        referenceVoucherId:
          type: integer
          nullable: true
        invoice:
          $ref: '#/components/schemas/Invoice'
    DocumentTypeEnum:
      type: string
      enum: [FE, NC, ND, TE, CCE, CPCE, RCEFE]
    Invoice:
      type: object
      required:
        - clave
        - numeroConsecutivo
        - fechaEmision
        - emisor
        - receptor
        - condicionVenta
        - detalle
        - resumen
      properties:
        clave:
          type: string
        numeroConsecutivo:
          type: string
        fechaEmision:
          type: string
          format: date-time
        emisor:
          $ref: '#/components/schemas/InvoiceParty'
        receptor:
          $ref: '#/components/schemas/InvoiceParty'
        condicionVenta:
          type: string
          description: Código según catálogo oficial (01 contado, 02 crédito, etc.).
        condicionVentaOtros:
          type: string
        plazoCredito:
          type: integer
        medioPago:
          type: array
          items:
            $ref: '#/components/schemas/InvoicePayment'
        detalle:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        otrosCargos:
          type: array
          items:
            type: object
          nullable: true
        resumen:
          $ref: '#/components/schemas/InvoiceSummary'
        referencias:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceReference'
    InvoiceParty:
      type: object
      required:
        - nombre
        - identificacion
        - ubicacion
      properties:
        nombre:
          type: string
        nombreComercial:
          type: string
        identificacion:
          $ref: '#/components/schemas/InvoiceIdentification'
        ubicacion:
          $ref: '#/components/schemas/Address'
        telefono:
          $ref: '#/components/schemas/Phone'
        fax:
          $ref: '#/components/schemas/Phone'
        correoElectronico:
          type: string
    InvoiceIdentification:
      type: object
      required: [tipo, numero]
      properties:
        tipo:
          type: string
        numero:
          type: string
    Address:
      type: object
      properties:
        provincia:
          type: string
        canton:
          type: string
        distrito:
          type: string
        barrio:
          type: string
        otrasSenas:
          type: string
    Phone:
      type: object
      properties:
        codigoPais:
          type: string
        numero:
          type: string
    InvoicePayment:
      type: object
      properties:
        tipo:
          type: string
        detalle:
          type: string
        monto:
          type: number
    InvoiceLine:
      type: object
      required:
        - numeroLinea
        - codigoCabys
        - cantidad
        - unidadMedida
        - detalle
        - precioUnitario
        - montoTotal
        - subTotal
        - totalLinea
      properties:
        numeroLinea:
          type: integer
        codigoCabys:
          type: string
        codigosComerciales:
          type: array
          items:
            type: string
        cantidad:
          type: number
        unidadMedida:
          type: string
        unidadMedidaComercial:
          type: string
        detalle:
          type: string
        precioUnitario:
          type: number
        montoTotal:
          type: number
        descuento:
          type: object
          properties:
            monto:
              type: number
            naturaleza:
              type: string
        subTotal:
          type: number
        impuestos:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceTax'
        otrosCargos:
          type: array
          items:
            type: object
        totalLinea:
          type: number
    InvoiceTax:
      type: object
      required: [codigo, tarifa, monto]
      properties:
        codigo:
          type: string
        codigoTarifa:
          type: string
        tarifa:
          type: number
        factorIVA:
          type: number
        monto:
          type: number
    InvoiceSummary:
      type: object
      required:
        - moneda
        - totalVenta
        - totalVentaNeta
        - totalImpuesto
        - totalComprobante
      properties:
        moneda:
          type: object
          properties:
            codigo:
              type: string
            tipoCambio:
              type: number
        totalServGravados:
          type: number
        totalServExentos:
          type: number
        totalServExonerado:
          type: number
        totalServNoSujeto:
          type: number
        totalMercanciasGravadas:
          type: number
        totalMercanciasExentas:
          type: number
        totalMercExonerada:
          type: number
        totalMercNoSujeta:
          type: number
        totalGravado:
          type: number
        totalExento:
          type: number
        totalExonerado:
          type: number
        totalNoSujeto:
          type: number
        totalVenta:
          type: number
        totalDescuentos:
          type: number
        totalVentaNeta:
          type: number
        totalDesgloseImpuesto:
          type: array
          items:
            type: object
            properties:
              codigo:
                type: string
              codigoTarifaIVA:
                type: string
              monto:
                type: number
        totalImpuesto:
          type: number
        totalImpAsumido:
          type: number
        totalIvaDevuelto:
          type: number
        totalOtrosCargos:
          type: number
        medioPago:
          type: array
          items:
            $ref: '#/components/schemas/InvoicePayment'
        totalComprobante:
          type: number
    InvoiceReference:
      type: object
      properties:
        tipoDocumento:
          type: string
        descripcion:
          type: string
        numero:
          type: string
        fecha:
          type: string
          format: date
        codigo:
          type: string
        razon:
          type: string
    Province:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Canton:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    District:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Neighborhood:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    CatalogEntry:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
    TaxCatalogEntry:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        descripcion:
          type: string
        tarifa:
          type: number
    UnitCatalogEntry:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        descripcion:
          type: string
