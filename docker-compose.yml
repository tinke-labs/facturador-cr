version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: facturador
      POSTGRES_USER: facturador
      POSTGRES_PASSWORD: facturador
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/facturador
      SPRING_DATASOURCE_USERNAME: facturador
      SPRING_DATASOURCE_PASSWORD: facturador
      APP_SECURITY_ENCRYPTION_SECRET: change-me-secret
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - ./storage:/app/storage
volumes:
  postgres-data:
